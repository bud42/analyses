---
containers:
  - name: BASH
    path: bash_latest.sif
  - name: tidyverse
    path: rstudio_4.4.2.sif
    source: docker://rocker/tidyverse:4.4.2
requirements:
  walltime: 0-8
  memory: 16G
inputs:
  xnat:
    subjects:
      sessions:
        - assessors:
          - types: FS7_v1
            resources:
              - resource: SUBJ
                ftype: FILE
                fmatch: stats/aseg.stats,stats/lh.aparc.stats,stats/rh.aparc.stats,stats/lh.w-g.pct.stats,stats/rh.w-g.pct.stats
                ddest: stats
pre:
  type: singularity_exec
  container: BASH
  args: >-
    bash -c "set -x;
    ls -ltrR /INPUTS;
    mkdir -p /OUTPUTS/SUBJECTS;
    cp -r /INPUTS/*/* /OUTPUTS/;
    echo ID > /OUTPUTS/sublist.csv;
    ls /OUTPUTS/SUBJECTS >> /OUTPUTS/sublist.csv;
    mkdir /OUTPUTS/LIBS;
    "
command:
  type: singularity_exec
  container: tidyverse
  args: >-
    Rscript -e "devtools::install_github('etw11/DunedinPACNI', lib='/OUTPUTS/LIBS');
    library(DunedinPACNI, lib.loc='/OUTPUTS/LIBS');
    df <- LoadFreeSurferStats(fsdir='/OUTPUTS/SUBJECTS', sublist='/OUTPUTS/sublist.csv');
    ExportDunedinPACNI(data=df, outdir='/OUTPUTS');"
